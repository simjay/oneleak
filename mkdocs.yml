site_name: oneleak
site_description: A lightweight, pure-Python sensitive-data scanner and sanitizer
site_url: https://oneleak.readthedocs.io/
repo_url: https://github.com/simjay/oneleak
repo_name: simjay/oneleak

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
      - Configuration: configuration.md
  - Guides:
      - CLI Reference: cli.md
      - Custom Rules: rules.md
      - Sanitization: sanitization.md
      - MCP Server: mcp.md
  - Advanced:
      - How Scanning & Sanitization Work: architecture.md
  - Reference:
      - API Reference: api.md
      - Changelog: changelog.md
