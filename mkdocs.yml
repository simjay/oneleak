site_name: oneleaks
site_description: A lightweight, pure-Python sensitive-data scanner and sanitizer
site_url: https://oneleaks.readthedocs.io/
repo_url: https://github.com/simjay/oneleaks
repo_name: simjay/oneleaks

theme:
  name: material
  # Rendered into an <img> and a <link rel="icon">, so each file carries an
  # explicit fill rather than currentColor, which would resolve to black in
  # those standalone contexts and disappear against the indigo header.
  logo: assets/mark-on-dark.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

plugins:
  - search
  # Docs moved into folders. These keep every already-published URL working,
  # e.g. /en/latest/mcp/ still lands on the MCP page.
  - redirects:
      redirect_maps:
        quickstart.md: getting-started/quickstart.md
        configuration.md: getting-started/configuration.md
        cli.md: guides/cli.md
        rules.md: guides/rules.md
        sanitization.md: guides/sanitization.md
        mcp.md: guides/mcp.md
        architecture.md: advanced/architecture.md
        concepts.md: advanced/concepts.md
        api.md: reference/api.md
        changelog.md: reference/changelog.md
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            docstring_style: google
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Guides:
      - CLI Reference: guides/cli.md
      - Custom Rules: guides/rules.md
      - Sanitization: guides/sanitization.md
      - MCP Server: guides/mcp.md
  - Advanced:
      - How Scanning & Sanitization Work: advanced/architecture.md
      - Concepts: advanced/concepts.md
  - Reference:
      - API Reference: reference/api.md
      - Changelog: reference/changelog.md
