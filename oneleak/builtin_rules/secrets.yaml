# Provider-specific and structured secret patterns.
#
# These are reasonable v0.1 approximations of publicly documented token
# formats, not a canonical/exhaustive database. Treat "priority" as the
# overlap-resolution tier: structured format (110, outranks PII, e.g. a
# connection-string password can look like an email's local@domain shape)
# > provider-specific (100, same tier as builtin PII rules) > keyword-anchored
# generic pattern (70) > generic assignment (50, handled in code, not here)
# > entropy-only (10, handled in code).
#
# Every rule here follows three criteria, regardless of which vendor it's for:
#
# 1. Precision. A rule may fire unguarded (no `keywords:`) only if it has a
#    `validator`, or its literal anchor is unconditionally required (not
#    behind an optional group like `(?:proj-)?`) and every wildcard segment
#    is exactly-bounded or narrowly bounded. A short or optional anchor
#    combined with a wide open-ended range (e.g. `{20,200}`) is a real
#    false-positive source. Anything that doesn't meet this bar gets
#    `keywords:` instead.
#
# 2. Severity. `critical` = the bare credential alone grants write/deploy/
#    admin capability over code, infrastructure, or money (cloud account
#    keys, source-control write tokens, registry publish tokens, payment
#    keys, private keys, live DB credentials). `high` = scoped/read access,
#    or a signing/verification secret that can forge or verify but not
#    directly act (webhook secrets, SaaS workspace tokens, messaging bot
#    tokens, restricted/scoped keys).
#
# 3. Naming. `type` always mirrors `id` (hyphens to underscores); `type`
#    drives the sanitizer's placeholder name.

rules:
  - id: aws-access-key-id
    category: secret
    type: aws_access_key_id
    severity: critical
    pattern: '\bAKIA[0-9A-Z]{16}\b'
    priority: 100

  - id: aws-secret-access-key
    category: secret
    type: aws_secret_access_key
    severity: critical
    # Anchored on the key name + assignment operator (like connection-string-credential's
    # `value` group) rather than a bare 40-char charset scan. The naive version let the
    # match window shift across the `=` delimiter itself, since `=`/`+`/`/` are all both
    # valid base64 characters AND common delimiter/padding characters.
    pattern: '(?i)\b(?:aws_secret_access_key|aws_secret_key)\b\s*[:=]\s*"?(?P<value>[A-Za-z0-9/+=]{40})'
    priority: 90

  - id: github-pat
    category: secret
    type: github_pat
    severity: critical
    pattern: '\bghp_[A-Za-z0-9]{36}\b'
    priority: 100

  - id: github-oauth-token
    category: secret
    type: github_oauth_token
    severity: critical
    pattern: '\bgho_[A-Za-z0-9]{36}\b'
    priority: 100

  - id: github-app-token
    category: secret
    type: github_app_token
    severity: critical
    pattern: '\b(?:ghu|ghs)_[A-Za-z0-9]{36}\b'
    priority: 100

  - id: github-refresh-token
    category: secret
    type: github_refresh_token
    severity: high
    pattern: '\bghr_[A-Za-z0-9]{36}\b'
    priority: 100

  - id: gitlab-pat
    category: secret
    type: gitlab_pat
    severity: critical
    pattern: '\bglpat-[A-Za-z0-9_-]{20}\b'
    priority: 100

  - id: openai-api-key
    category: secret
    type: openai_api_key
    severity: critical
    # proj-/svcacct- is required, not optional: an optional anchor collapses
    # to a bare "sk-" prefix, a real false-positive source (see the
    # precision criterion above). Genuinely bare "sk-" legacy keys are
    # covered by openai-api-key-legacy instead, gated by keyword.
    pattern: '\bsk-(?:proj|svcacct)-[A-Za-z0-9_-]{20,100}'
    priority: 100

  - id: openai-api-key-legacy
    category: secret
    type: openai_api_key_legacy
    severity: critical
    # Excludes proj-/svcacct-/ant- via lookahead so this never double-matches
    # openai-api-key's or anthropic-api-key's span.
    pattern: '\bsk-(?!proj-|svcacct-|ant-)[A-Za-z0-9_-]{20,100}\b'
    keywords: ["openai", "openai_api_key", "openai-api-key"]
    priority: 100

  - id: anthropic-api-key
    category: secret
    type: anthropic_api_key
    severity: critical
    pattern: '\bsk-ant-[A-Za-z0-9_-]{20,100}'
    priority: 100

  - id: slack-token
    category: secret
    type: slack_token
    severity: high
    pattern: '\bxox[baprs]-[A-Za-z0-9-]{10,48}\b'
    priority: 100

  - id: slack-webhook-url
    category: secret
    type: slack_webhook_url
    severity: high
    pattern: 'https://hooks\.slack\.com/services/T[A-Za-z0-9]+/B[A-Za-z0-9]+/[A-Za-z0-9]+'
    priority: 100

  - id: stripe-secret-key
    category: secret
    type: stripe_secret_key
    severity: critical
    pattern: '\bsk_live_[A-Za-z0-9]{24,60}'
    priority: 100

  - id: stripe-restricted-key
    category: secret
    type: stripe_restricted_key
    severity: high
    pattern: '\brk_live_[A-Za-z0-9]{24,60}'
    priority: 100

  - id: twilio-api-key
    category: secret
    type: twilio_api_key
    severity: high
    pattern: '\bSK[a-f0-9]{32}\b'
    priority: 100

  - id: datadog-api-key
    category: secret
    type: datadog_api_key
    severity: high
    pattern: '\b[a-f0-9]{32}\b'
    keywords: ["datadog", "dd_api_key", "dd-api-key"]
    priority: 70

  - id: google-api-key
    category: secret
    type: google_api_key
    severity: high
    pattern: '\bAIza[0-9A-Za-z_-]{35}\b'
    priority: 100

  - id: azure-storage-key
    category: secret
    type: azure_storage_key
    severity: high
    # No trailing \b: `=` is a non-word char, so a boundary can never exist
    # right after `==` padding (nothing can satisfy word|non-word on both
    # sides).
    pattern: '\b[A-Za-z0-9+/]{86}=='
    keywords: ["azure", "accountkey", "account_key"]
    priority: 70

  - id: pypi-token
    category: secret
    type: pypi_token
    severity: critical
    pattern: '\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,120}'
    priority: 100

  - id: npm-token
    category: secret
    type: npm_token
    severity: critical
    pattern: '\bnpm_[A-Za-z0-9]{36}\b'
    priority: 100

  # --- AI / dev-tool providers ---

  - id: huggingface-token
    category: secret
    type: huggingface_token
    severity: critical
    pattern: '\bhf_[A-Za-z0-9]{34}\b'
    priority: 100

  - id: replicate-api-token
    category: secret
    type: replicate_api_token
    severity: critical
    pattern: '\br8_[A-Za-z0-9]{37}\b'
    priority: 100

  - id: groq-api-key
    category: secret
    type: groq_api_key
    severity: critical
    pattern: '\bgsk_[A-Za-z0-9]{20,60}\b'
    priority: 100

  # --- Cloud / infra ---

  - id: aws-temp-access-key-id
    category: secret
    type: aws_temp_access_key_id
    severity: critical
    # STS temporary/session credentials, the ASIA-prefixed counterpart to aws-access-key-id's AKIA.
    pattern: '\bASIA[0-9A-Z]{16}\b'
    priority: 100

  - id: digitalocean-pat
    category: secret
    type: digitalocean_pat
    severity: critical
    pattern: '\bdop_v1_[a-f0-9]{64}\b'
    priority: 100

  - id: cloudflare-api-token
    category: secret
    type: cloudflare_api_token
    severity: high
    pattern: '\b[A-Za-z0-9_-]{40}\b'
    keywords: ["cloudflare", "cf_api_token", "cf-api-token"]
    priority: 70

  - id: vault-service-token
    category: secret
    type: vault_service_token
    severity: critical
    pattern: '\bhvs\.[A-Za-z0-9_-]{24,100}\b'
    priority: 100

  - id: docker-hub-pat
    category: secret
    type: docker_hub_pat
    severity: critical
    # Registry publish access is the same supply-chain risk class as
    # npm-token/pypi-token (both critical), not a "high" scoped-read token.
    pattern: '\bdckr_pat_[A-Za-z0-9_-]{27}\b'
    priority: 100

  - id: terraform-cloud-token
    category: secret
    type: terraform_cloud_token
    severity: critical
    pattern: '\b[A-Za-z0-9]{14}\.atlasv1\.[A-Za-z0-9_-]{60,90}\b'
    priority: 100

  - id: google-oauth-client-secret
    category: secret
    type: google_oauth_client_secret
    severity: critical
    pattern: '\bGOCSPX-[A-Za-z0-9_-]{20,40}\b'
    priority: 100

  - id: heroku-api-key
    category: secret
    type: heroku_api_key
    severity: high
    # Heroku API keys are bare UUIDs, no fixed prefix, hence the keyword gate
    # (same reasoning as cloudflare-api-token/datadog-api-key above).
    pattern: '\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'
    keywords: ["heroku", "heroku_api_key"]
    priority: 70

  # --- SaaS / dev tools ---

  - id: sendgrid-api-key
    category: secret
    type: sendgrid_api_key
    severity: critical
    pattern: '\bSG\.[A-Za-z0-9_-]{20,50}\.[A-Za-z0-9_-]{20,50}\b'
    priority: 100

  - id: postman-api-key
    category: secret
    type: postman_api_key
    severity: high
    pattern: '\bPMAK-[a-f0-9]{24}-[a-f0-9]{34}\b'
    priority: 100

  - id: sentry-auth-token
    category: secret
    type: sentry_auth_token
    severity: high
    pattern: '\bsntry(?:s|u)_[A-Za-z0-9_+/=]{40,100}\b'
    priority: 100

  - id: newrelic-api-key
    category: secret
    type: newrelic_api_key
    severity: high
    pattern: '\bNRAK-[A-Z0-9]{27}\b'
    priority: 100

  - id: planetscale-token
    category: secret
    type: planetscale_token
    severity: critical
    pattern: '\bpscale_tkn_[A-Za-z0-9_]{32,64}\b'
    priority: 100

  - id: supabase-access-token
    category: secret
    type: supabase_access_token
    severity: critical
    pattern: '\bsbp_[a-f0-9]{40}\b'
    priority: 100

  - id: shopify-access-token
    category: secret
    type: shopify_access_token
    severity: critical
    pattern: '\bshp(?:at|ss|ca)_[a-fA-F0-9]{32}\b'
    priority: 100

  - id: mailchimp-api-key
    category: secret
    type: mailchimp_api_key
    severity: critical
    # The -usNN datacenter suffix is Mailchimp-specific and meaningfully cuts
    # collision risk vs. a bare 32-char hex string.
    pattern: '\b[a-f0-9]{32}-us\d{1,2}\b'
    priority: 100

  - id: square-access-token
    category: secret
    type: square_access_token
    severity: critical
    pattern: '\bsq0atp-[A-Za-z0-9_-]{22}\b'
    priority: 100

  - id: square-oauth-secret
    category: secret
    type: square_oauth_secret
    severity: critical
    pattern: '\bsq0csp-[A-Za-z0-9_-]{43}\b'
    priority: 100

  - id: stripe-webhook-secret
    category: secret
    type: stripe_webhook_secret
    severity: high
    pattern: '\bwhsec_[A-Za-z0-9]{32,64}\b'
    priority: 100

  - id: linear-api-key
    category: secret
    type: linear_api_key
    severity: high
    # SaaS workspace data access, not infra/code/money control.
    pattern: '\blin_api_[A-Za-z0-9]{40}\b'
    priority: 100

  - id: notion-integration-token
    category: secret
    type: notion_integration_token
    severity: high
    # SaaS workspace data access, not infra/code/money control. Only the
    # newer ntn_-prefixed format: the older secret_-prefixed format collides
    # with ordinary variable-naming convention (secret_key, secret_token)
    # and isn't a reliable enough anchor.
    pattern: '\bntn_[A-Za-z0-9]{40,50}\b'
    priority: 100

  - id: airtable-pat
    category: secret
    type: airtable_pat
    severity: high
    # SaaS workspace data access, not infra/code/money control.
    pattern: '\bpat[A-Za-z0-9]{14}\.[a-f0-9]{64}\b'
    priority: 100

  - id: mapbox-secret-token
    category: secret
    type: mapbox_secret_token
    severity: critical
    # Mapbox secret tokens are JWT-like but with a literal "sk." prefix
    # instead of "ey"; the exact internal shape is approximate, so this is
    # keyword-gated rather than trusted on the pattern alone.
    pattern: '\bsk\.[A-Za-z0-9_.-]{60,300}\b'
    keywords: ["mapbox", "mapbox_token", "mapbox_secret"]
    priority: 100

  - id: algolia-admin-api-key
    category: secret
    type: algolia_admin_api_key
    severity: high
    # Algolia admin keys have no fixed prefix, hence the keyword gate (same
    # reasoning as cloudflare-api-token/heroku-api-key).
    pattern: '\b[A-Za-z0-9]{32}\b'
    keywords: ["algolia", "algolia_api_key", "algolia-api-key"]
    priority: 70

  - id: facebook-access-token
    category: secret
    type: facebook_access_token
    severity: high
    # "EAA" is only a 3-char prefix with a wide open range behind it, a real
    # false-positive source on high-entropy text, hence the keyword gate.
    pattern: '\bEAA[A-Za-z0-9]{20,200}\b'
    keywords: ["facebook", "fb_access_token", "fb_token"]
    priority: 100

  # --- Messaging ---

  - id: discord-bot-token
    category: secret
    type: discord_bot_token
    severity: high
    pattern: '\b[MN][A-Za-z\d]{23}\.[\w-]{6}\.[\w-]{27}\b'
    priority: 100

  - id: discord-webhook-url
    category: secret
    type: discord_webhook_url
    severity: high
    pattern: 'https://discord(?:app)?\.com/api/webhooks/\d+/[A-Za-z0-9_-]+'
    priority: 100

  - id: telegram-bot-token
    category: secret
    type: telegram_bot_token
    severity: high
    pattern: '\b\d{8,10}:[A-Za-z0-9_-]{35}\b'
    priority: 100

  # --- Special formats (structural anchors, see docs/concepts.md) ---

  - id: pem-private-key
    category: secret
    type: private_key
    severity: critical
    pattern: '-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]+?-----END [A-Z ]*PRIVATE KEY-----'
    priority: 110

  - id: pgp-private-key
    category: secret
    type: pgp_private_key
    severity: critical
    # pem-private-key's pattern requires a literal "PRIVATE KEY-----" ending, which
    # PGP's "PRIVATE KEY BLOCK-----" ending doesn't satisfy. Separate rule, not a
    # tweak to that pattern, so the two stay independently readable.
    pattern: '-----BEGIN PGP PRIVATE KEY BLOCK-----[\s\S]+?-----END PGP PRIVATE KEY BLOCK-----'
    priority: 110

  - id: jwt
    category: secret
    type: jwt
    severity: high
    pattern: '\bey[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b'
    validator: jwt
    priority: 110

  - id: connection-string-credential
    category: secret
    type: connection_string_credential
    severity: critical
    # A live DB credential grants direct read/write/delete on production
    # data, on par with the other critical infra-access rules.
    pattern: '\b(?:postgres|postgresql|mysql|mongodb|redis|amqp|mssql)://[^:/\s]+:(?P<value>[^@\s]+)@[^\s]+'
    priority: 110

  - id: http-basic-auth-credential
    category: secret
    type: http_basic_auth_credential
    severity: high
    # Same shape as connection-string-credential but for plain http(s)/ftp URLs
    # rather than db schemes. Disjoint scheme lists, so the two never compete
    # for the same match.
    pattern: '\b(?:https?|ftp)://[^:/\s]+:(?P<value>[^@\s]+)@[^\s]+'
    priority: 110
