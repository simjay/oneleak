# oneleaks's own config, used by the pre-commit dogfood hook and `oneleaks scan .`
#
# .plan/ (untracked local planning notes) and docs/ intentionally contain
# illustrative example secrets/PII to document what the detectors catch.
# These are known, permanent non-findings, not something to chase per-commit.

exclude:
  - "site/**"   # mkdocs build output, gitignored, may exist locally
  - "uv.lock"   # package-hash URLs are noisy, non-secret entropy. Skips scanning
                # it entirely for directory-walk scans (scan(), `oneleaks scan .`).
                # git-based scans (--staged/--changed/--history) never consult
                # `exclude` at all, only `allow.paths` below, so uv.lock is
                # listed in both.

allow:
  paths:
    - ".plan/**"
    - "docs/**"
    - "tests/**"                    # fake-but-realistic secrets are the whole point of positive tests
    - "scripts/**"                  # benchmark.py uses fake emails/keys as synthetic scan content
    - "oneleaks/builtin_rules/**"    # rule *patterns*, not real secrets. A fully-literal
                                     # pattern (e.g. pgp-private-key's BEGIN/END markers)
                                     # can match its own definition
    - "uv.lock"                     # see the `exclude` entry above for why it's here too
    - "README.md"
    - "CHANGELOG.md"
    - "CONTRIBUTING.md"
