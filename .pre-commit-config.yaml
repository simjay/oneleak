repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy oneleaks
        language: system
        pass_filenames: false
        types: [python]

      - id: oneleaks-scan-staged
        name: oneleaks scan --staged
        description: Dogfooding, oneleaks scanning its own staged changes before commit
        entry: uv run oneleaks scan --staged --fail-on high
        language: system
        pass_filenames: false
        always_run: true
