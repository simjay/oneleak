# Structured PII patterns.
#
# Priority uses the same overlap-resolution tiers as secrets.yaml (see that
# file's header): PII candidates and secret candidates compete for the same
# span through one shared resolution step (e.g. a connection-string
# password can look like an email's local@domain shape), so the tiers are
# shared, not redefined here.
#
# secrets.yaml's precision/severity/naming criteria all still apply. Two
# things specific to PII, on top of those:
#
# 1. Evidence. Most PII values have no vendor-issued prefix to anchor on
#    (unlike a secret's "sk-" or "ghp_"), so precision here leans on a real
#    checksum (ssn, luhn, iban, aba_routing) or full structural shape
#    (ipv4/ipv6/mac-address) rather than a literal anchor. A bare,
#    unvalidated, unstructured pattern is the wrong shape for a PII rule.
#
# 2. Severity trends low/medium, not high/critical: a leaked email or phone
#    number is rarely as immediately actionable as a leaked credential.
#    ssn/credit-card/imei are the deliberate exceptions (high/medium),
#    since those specific values enable direct fraud on their own.

rules:
  - id: email
    category: pii
    type: email
    severity: low
    pattern: '(?:(?<=mailto:)|(?<!:))\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
    priority: 100

  - id: phone
    category: pii
    type: phone
    severity: low
    pattern: '(?<!\d)(?:\+?1[-.\s]?)?\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4}(?!\d)'
    priority: 90

  - id: ssn
    category: pii
    type: ssn
    severity: high
    pattern: '\b\d{3}-\d{2}-\d{4}\b'
    validator: ssn
    priority: 100

  - id: credit-card
    category: pii
    type: credit_card
    severity: high
    pattern: '\b(?:\d[ -]?){12,18}\d\b'
    validator: credit_card
    priority: 100

  - id: ipv4
    category: pii
    type: ipv4
    severity: low
    pattern: '\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b'
    validator: public_ipv4
    priority: 80

  - id: ipv6
    category: pii
    type: ipv6
    severity: low
    pattern: '\b(?:[A-Fa-f0-9]{1,4}:){2,7}[A-Fa-f0-9:]{1,4}\b'
    validator: public_ipv6
    priority: 80

  - id: iban
    category: pii
    type: iban
    severity: medium
    pattern: '\b[A-Z]{2}\d{2}[A-Z0-9]{10,30}\b'
    validator: iban
    priority: 100

  - id: imei
    category: pii
    type: imei
    severity: medium
    # IMEI's check digit is the Luhn algorithm, same as credit-card. A bare
    # 15-digit Luhn-valid number is ambiguous with an Amex card, so keyword
    # context is required, and outranks credit-card's priority 100 when
    # present.
    pattern: '\b\d{15}\b'
    keywords: ["imei", "device id", "device_id", "serial number"]
    validator: luhn
    priority: 105

  - id: mac-address
    category: pii
    type: mac_address
    severity: low
    pattern: '\b(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}\b'
    priority: 80

  - id: bank-routing-number
    category: pii
    type: bank_routing_number
    severity: medium
    pattern: '\b\d{9}\b'
    keywords: ["routing", "routing number", "routing_number", "aba", "aba number"]
    validator: aba_routing
    priority: 90
