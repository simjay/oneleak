[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oneleak"
version = "0.1.0"
description = "A lightweight, pure-Python sensitive-data scanner and sanitizer for developer and agent workflows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Jae Sim" }]
keywords = [
    "security",
    "secrets-detection",
    "pii",
    "sanitization",
    "pre-commit",
    "llm-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/simjay/oneleak"
Repository = "https://github.com/simjay/oneleak"
Issues = "https://github.com/simjay/oneleak/issues"
Changelog = "https://github.com/simjay/oneleak/blob/main/CHANGELOG.md"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
oneleak = "oneleak.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["oneleak"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260724",
    "pre-commit>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
