[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oneleak"
# Single source of truth is oneleak/__init__.py's __version__, read by hatch
# below -- so `oneleak --version` and the packaged version can never drift.
dynamic = ["version"]
description = "A lightweight, pure-Python sensitive-data scanner and sanitizer for developer and agent workflows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Jae Sim" }]
keywords = [
    "security",
    "secrets-detection",
    "pii",
    "sanitization",
    "pre-commit",
    "llm-agents",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/simjay/oneleak"
Repository = "https://github.com/simjay/oneleak"
Issues = "https://github.com/simjay/oneleak/issues"
Changelog = "https://github.com/simjay/oneleak/blob/main/CHANGELOG.md"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
mcp = [
    # Pinned below 2.0: the official SDK's v2.0 beta renames FastMCP to
    # MCPServer and is not yet stable as of this writing.
    "mcp>=1.0,<2.0",
]

[project.scripts]
oneleak = "oneleak.cli:main"
oneleak-mcp = "oneleak.mcp_server:main"

[tool.hatch.version]
path = "oneleak/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["oneleak"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260724",
    "pre-commit>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit rather than relying on whatever this ruff version's implicit
# default happens to be (which can change between releases). Includes
# isort-equivalent import sorting/grouping (I) -- no separate isort tool
# needed.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["oneleak"]
