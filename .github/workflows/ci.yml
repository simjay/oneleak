name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check oneleak tests

      - name: Format check
        run: uv run ruff format --check oneleak tests

      - name: Type check
        run: uv run mypy oneleak

      - name: Test
        run: uv run pytest

      - name: Build docs (strict)
        run: uv run mkdocs build --strict
