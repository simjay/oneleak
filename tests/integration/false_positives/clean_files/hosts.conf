# What this catches: local network addresses reported as personal data.
#
# Loopback, RFC 1918 private ranges and the documentation ranges cannot identify
# anyone, and they appear in almost every project's config files.

bind            = 0.0.0.0
loopback        = 127.0.0.1
private_a       = 10.10.1.10
private_b       = 172.16.0.1
private_c       = 192.168.1.5
link_local      = 169.254.1.1
doc_range_v4    = 192.0.2.44
doc_range_v4_b  = 198.51.100.7
doc_range_v4_c  = 203.0.113.9
doc_range_v6    = 2001:db8:85a3::8a2e:370:7334
